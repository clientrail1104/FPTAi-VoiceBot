<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Assistant UI</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #1a1d24;
      --accent-color: #4c8bf5;
      --accent-glow: rgba(76, 139, 245, 0.4);
      --text-color: #f0f3f8;
      --text-muted: #9aa0a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-top: 12px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .conversation-container {
      width: 100%;
      max-width: 600px;
      flex-grow: 1;
      overflow-y: auto;
      margin: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 12px;
    }

    .message {
      padding: 14px 18px;
      border-radius: 18px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 1rem;
    }

    .user-message {
      align-self: flex-end;
      background-color: #2b303b;
      color: var(--text-color);
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      align-self: flex-start;
      background-color: var(--card-bg);
      border: 1px solid #2a2e39;
      color: var(--text-color);
      border-bottom-left-radius: 4px;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 16px;
    }

    .status-indicator {
      font-size: 0.9rem;
      color: var(--text-muted);
      height: 20px;
    }

    /* Orb / Mic Button Visualizer */
    .mic-button {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #4c8bf5, #8ab4f8);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .mic-button:hover {
      transform: scale(1.05);
    }

    .mic-button svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
      z-index: 2;
    }

    /* Pulse animations for voice active state */
    .mic-button.listening::before,
    .mic-button.listening::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background-color: var(--accent-color);
      opacity: 0.6;
      z-index: 1;
      animation: pulse 2s infinite ease-out;
    }

    .mic-button.listening::after {
      animation-delay: 1s;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Voice Assistant Interface</h1>
  </header>

  <main class="conversation-container" id="conversation"></main>

  <div class="controls-container">
    <div class="status-indicator" id="status">Tap the button to start speaking</div>
    <button class="mic-button" id="micBtn" aria-label="Toggle voice input">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const conversation = document.getElementById('conversation');

    // Speech Recognition setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        statusText.textContent = "Listening...";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        statusText.textContent = "Tap to speak";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        appendMessage(transcript, 'user');
        handleResponse(transcript);
      };

      recognition.onerror = (event) => {
        statusText.textContent = "Error occurred: " + event.error;
        micBtn.classList.remove('listening');
        isListening = false;
      };
    } else {
      statusText.textContent = "Web Speech API is not supported in this browser.";
      micBtn.disabled = true;
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return;

      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      msgDiv.textContent = text;
      conversation.appendChild(msgDiv);
      conversation.scrollTop = conversation.scrollHeight;
    }

    function handleResponse(userInput) {
      statusText.textContent = "Thinking...";
      
      // Simulate backend AI response delay
      setTimeout(() => {
        const replyText = `Received request: "${userInput}". How else can I help you?`;
        appendMessage(replyText, 'bot');
        speakText(replyText);
      }, 1000);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        statusText.textContent = "Speaking...";
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => {
          statusText.textContent = "Tap to speak";
        };
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
