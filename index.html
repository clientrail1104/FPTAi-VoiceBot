<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borang e-Bantuan</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f7;
      color: #1f2937;
    }

    .page-header {
      background: #0f4c81;
      color: #ffffff;
      padding: 26px 20px;
      text-align: center;
    }

    .page-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .page-header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: 32px auto;
    }

    .form-card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .section {
      padding: 28px;
      border-bottom: 1px solid #e5e7eb;
    }

    .section:last-child {
      border-bottom: none;
    }

    .section-title {
      margin: 0 0 22px;
      font-size: 18px;
      color: #0f4c81;
      border-left: 4px solid #0f4c81;
      padding-left: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    .required {
      color: #dc2626;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 11px 12px;
      font-size: 14px;
      background: #ffffff;
      color: #111827;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #0f4c81;
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.12);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .help-text {
      margin: 0;
      font-size: 12px;
      color: #64748b;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 24px 28px;
      background: #f8fafc;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-primary {
      background: #0f4c81;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0b3d68;
    }

    .success-message {
      display: none;
      margin: 0 28px 24px;
      padding: 14px 16px;
      border-radius: 6px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .section {
        padding: 22px 18px;
      }

      .actions {
        padding: 20px 18px;
        flex-direction: column-reverse;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <h1>Borang e-Bantuan</h1>
    <p>Sila lengkapkan maklumat di bawah untuk menghantar maklumbalas anda.</p>
  </header>

  <main class="container">
    <form id="ebantuanForm" class="form-card" enctype="multipart/form-data">
      <section class="section">
        <h2 class="section-title">BUTIRAN MAKLUMBALAS</h2>

        <div class="form-grid">
          <div class="form-group full">
            <label for="tajuk">
              Tajuk Maklumbalas <span class="required">*</span>
            </label>
            <input
              type="text"
              id="tajuk"
              name="tajuk_maklumbalas"
              placeholder="Masukkan tajuk maklumbalas"
              required
            />
          </div>

          <div class="form-group full">
            <label for="negeri">
              Negeri Terlibat <span class="required">*</span>
            </label>
            <select id="negeri" name="negeri_terlibat" required>
              <option value="">-- Sila Pilih Negeri --</option>
              <option>BINTULU SARAWAK</option>
              <option>JOHOR</option>
              <option>KEDAH</option>
              <option>KELANTAN</option>
              <option>KUALA LUMPUR</option>
              <option>LABUAN</option>
              <option>LUAR NEGARA</option>
              <option>MELAKA</option>
              <option>MIRI SARAWAK</option>
              <option>NEGERI SEMBILAN</option>
              <option>PAHANG</option>
              <option>PERAK</option>
              <option>PERLIS</option>
              <option>PULAU PINANG</option>
              <option>PUTRAJAYA</option>
              <option>SABAH</option>
              <option>SANDAKAN SABAH</option>
              <option>SARAWAK</option>
              <option>SELANGOR</option>
              <option>TAWAU SABAH</option>
              <option>TERENGGANU</option>
              <option>SIBU SARAWAK</option>
            </select>
          </div>

          <div class="form-group full">
            <label for="huraian">
              Huraian Maklumbalas <span class="required">*</span>
            </label>
            <textarea
              id="huraian"
              name="huraian_maklumbalas"
              placeholder="Sila terangkan maklumbalas anda dengan lengkap"
              required
            ></textarea>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">BUTIRAN PERIBADI</h2>

        <div class="form-grid">
          <div class="form-group">
            <label for="nama">
              Nama <span class="required">*</span>
            </label>
            <input type="text" id="nama" name="nama" required />
          </div>

          <div class="form-group">
            <label for="mykad">
              MyKad/Pasport <span class="required">*</span>
            </label>
            <input
              type="text"
              id="mykad"
              name="mykad_pasport"
              placeholder="Contoh: 900101-01-1234"
              required
            />
          </div>

          <div class="form-group">
            <label for="syarikat">
              Syarikat <span class="required">*</span>
            </label>
            <input type="text" id="syarikat" name="syarikat" required />
          </div>

          <div class="form-group">
            <label for="noPendaftaran">
              No Pendaftaran Syarikat <span class="required">*</span>
            </label>
            <input
              type="text"
              id="noPendaftaran"
              name="no_pendaftaran_syarikat"
              required
            />
          </div>

          <div class="form-group">
            <label for="telefon">
              Tel. Bimbit <span class="required">*</span>
            </label>
            <input
              type="tel"
              id="telefon"
              name="tel_bimbit"
              placeholder="Contoh: 0123456789"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">
              Email <span class="required">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nama@email.com"
              required
            />
          </div>

          <div class="form-group full">
            <label for="kategori">
              Kategori Pelanggan <span class="required">*</span>
            </label>
            <select id="kategori" name="kategori_pelanggan" required>
              <option value="">-- Sila Pilih Kategori --</option>
              <option>Kontraktor</option>
              <option>Personal Binaan</option>
              <option>Pertubuhan</option>
              <option>Syarikat</option>
              <option>Individu</option>
              <option>Agensi Kerajaan</option>
              <option>Lain-lain Kategori</option>
            </select>
          </div>

          <div class="form-group full">
            <label for="dokumen">Dokumen Sokongan</label>
            <input
              type="file"
              id="dokumen"
              name="dokumen_sokongan"
              multiple
              accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
            />
            <p class="help-text">
              Format dicadangkan: PDF, JPG, PNG, DOC atau DOCX.
            </p>
          </div>
        </div>
      </section>

      <div id="successMessage" class="success-message"></div>

      <div class="actions">
        <button type="reset" class="btn-secondary">Set Semula</button>
        <button type="submit" class="btn-primary">Hantar</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("ebantuanForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const now = new Date();
      const datePart =
        now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0");

      const randomNumber = String(
        Math.floor(Math.random() * 9999) + 1
      ).padStart(4, "0");

      const referenceNo = `EB-${datePart}-${randomNumber}`;

      const formData = new FormData(form);
      const response = {};

      for (const [key, value] of formData.entries()) {
        if (value instanceof File) {
          if (value.name) {
            if (!response[key]) response[key] = [];
            response[key].push(value.name);
          }
        } else {
          response[key] = value;
        }
      }

      response.no_rujukan = referenceNo;
      response.tarikh_hantaran = now.toISOString();

      console.log("Maklumbalas diterima:", response);

      successMessage.innerHTML =
        "<strong>Maklumbalas berjaya dihantar.</strong><br>" +
        "No. Rujukan: <strong>" +
        referenceNo +
        "</strong>";

      successMessage.style.display = "block";
      successMessage.scrollIntoView({ behavior: "smooth", block: "center" });

      /*
        IMPORTANT:
        This demo currently stores the submitted data only in the browser console.

        To save responses permanently, connect the form to a backend/API, e.g.:

        fetch("/api/ebantuan", {
          method: "POST",
          body: formData
        });
      */
    });

    form.addEventListener("reset", function () {
      successMessage.style.display = "none";
      successMessage.innerHTML = "";
    });
  </script>
<script src="telephony-autofill-receiver.js"></script>  
</body>
</html>
