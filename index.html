<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airport Voice Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 24px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #003d80;
    }
    .status {
      margin-top: 20px;
      font-weight: bold;
      color: #555;
    }
    .transcript {
      margin-top: 15px;
      font-style: italic;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Airport Information Voice Assistant</h2>
    <p>Press the button below and ask a question about flights, facilities, or airport services.</p>
    
    <button id="start-btn">Start Listening</button>
    
    <div class="status" id="status-text">Status: Idle</div>
    <div class="transcript" id="transcript-text"></div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status-text');
    const transcriptText = document.getElementById('transcript-text');

    // Check for standard Web Speech API support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      startBtn.addEventListener('click', () => {
        recognition.start();
        statusText.innerText = "Status: Listening...";
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        transcriptText.innerText = `You said: "${transcript}"`;
        statusText.innerText = "Status: Processing...";
        
        handleQuery(transcript);
      };

      recognition.onerror = (event) => {
        statusText.innerText = `Error: ${event.error}`;
      };

      recognition.onend = () => {
        if (statusText.innerText === "Status: Listening...") {
          statusText.innerText = "Status: Idle";
        }
      };
    } else {
      statusText.innerText = "Web Speech API is not supported in this browser.";
      startBtn.disabled = true;
    }

    // Process user input and trigger voice response
    function handleQuery(query) {
      const lowerQuery = query.toLowerCase();
      let response = "I'm sorry, I don't have information on that topic. Please check the main information desk.";

      if (lowerQuery.includes("flight") || lowerQuery.includes("gate")) {
        response = "For flight schedules and gate assignments, please check the digital display boards or use the official airport mobile application.";
      } else if (lowerQuery.includes("wifi") || lowerQuery.includes("internet")) {
        response = "Free Wi-Fi is available throughout the airport terminal. Connect to the official airport Wi-Fi network to get online.";
      } else if (lowerQuery.includes("baggage") || lowerQuery.includes("luggage")) {
        response = "Baggage claim is located on the ground level after clearing arrival immigration.";
      }

      speakResponse(response);
    }

    // Text-to-Speech synthesis
    function speakResponse(text) {
      statusText.innerText = "Status: Speaking...";
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.onend = () => {
        statusText.innerText = "Status: Idle";
      };
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
